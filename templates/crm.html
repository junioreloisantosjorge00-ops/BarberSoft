{% extends "base.html" %}{% block body %}<section class="wrap"><h1>CRM de clientes</h1>{% include "_anav.html" %}
<form method="post" class="form"><input type="hidden" name="id" value="{{ ed.id if ed }}"><h3>{{ 'Editar' if ed else 'Nuevo' }} cliente</h3>
<label>Nombre<input name="name" required value="{{ ed.name if ed }}"></label><label>Teléfono<input name="phone" value="{{ ed.phone if ed }}"></label><label>Correo<input name="email" value="{{ ed.email if ed }}"></label>
<label>Estado<select name="status">{% for s in ['Interesado','Cotizado','Cliente','Perdido'] %}<option {{ 'selected' if ed and ed.status==s }}>{{ s }}</option>{% endfor %}</select></label><label>Notas<textarea name="notes">{{ ed.notes if ed }}</textarea></label><button class="btn">Guardar</button></form>
<table><tr><th>Nombre</th><th>Teléfono</th><th>Estado</th><th>Notas</th><th></th></tr>{% for r in rows %}<tr><td>{{ r.name }}</td><td>{{ r.phone }}</td><td>{{ r.status }}</td><td>{{ r.notes }}</td><td><a href="?edit={{ r.id }}">Editar</a><form method="post" action="{{ url_for('crm_del', i=r.id) }}" onsubmit="return confirm('¿Borrar?')"><button class="lnk">Borrar</button></form></td></tr>{% endfor %}</table></section>{% endblock %}
