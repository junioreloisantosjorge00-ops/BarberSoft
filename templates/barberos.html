{% extends "base.html" %}{% block title %}Barberos{% endblock %}{% block body %}
<div class="banner"><h1>Barberos y barberías</h1></div><section class="wrap"><div class="grid">{% for b in bs %}<div class="card"><div class="av big">{{ (b.shop or b.name)[:1] }}</div><h3>{{ b.shop or b.name }}</h3><p>📍 {{ b.address or 'Sin dirección' }}</p>
<a class="btn sm" href="{{ url_for('barbero_perfil', i=b.id) }}">Ver perfil</a> {% if b.whatsapp %}<a class="btn sm alt" target="_blank" href="https://wa.me/{{ b.whatsapp|wa }}">WhatsApp</a>{% endif %}</div>{% endfor %}</div></section>{% endblock %}
