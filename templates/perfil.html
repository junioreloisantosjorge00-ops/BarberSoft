{% extends "base.html" %}{% block body %}<section class="wrap narrow"><h1>Mi perfil</h1>{% include "_anav.html" %}
<form method="post" enctype="multipart/form-data" class="form"><label>Nombre<input name="name" value="{{ me.name }}"></label><label>Barbería<input name="shop" value="{{ me.shop or '' }}"></label><label>Teléfono<input name="phone" value="{{ me.phone or '' }}"></label>
<label>WhatsApp (con código país)<input name="whatsapp" value="{{ me.whatsapp or '' }}"></label><label>Dirección / ubicación<input name="address" value="{{ me.address or '' }}"></label><label>Sobre mí<textarea name="bio">{{ me.bio or '' }}</textarea></label><label>Foto<input type="file" name="avatar" accept="image/*"></label><button class="btn">Guardar</button> <a href="{{ url_for('barbero_perfil', i=me.id) }}">Ver perfil público</a></form></section>{% endblock %}
