{% extends "base.html" %}{% block body %}<section class="wrap"><h1>Facturas</h1>{% include "_anav.html" %}<p><a class="btn" href="{{ url_for('factura_form') }}">+ Nueva factura</a></p>
<table><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>Total</th><th></th></tr>{% for r in rows %}<tr><td>F-{{ '%05d'|format(r.id) }}</td><td>{{ r.created }}</td><td>{{ r.client_name }}</td><td>RD$ {{ '%.2f'|format(r.total) }}</td><td><a href="{{ url_for('ticket', i=r.id) }}" target="_blank">🖨 Ticket</a> <a href="{{ url_for('factura_form', i=r.id) if false else url_for('factura_form', i=r.id) }}">Editar</a><form method="post" action="{{ url_for('factura_del', i=r.id) }}" onsubmit="return confirm('¿Borrar?')"><button class="lnk">Borrar</button></form></td></tr>{% endfor %}</table></section>{% endblock %}
